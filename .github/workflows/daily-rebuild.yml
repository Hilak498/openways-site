# Rebuilds the site on Vercel every day at 07:00 Israel time so new articles
# from the Soro RSS feed become static blog pages.
#
# Setup: create a Deploy Hook in Vercel (Project → Settings → Git → Deploy
# Hooks, branch "main") and save its URL as the repository secret
# VERCEL_DEPLOY_HOOK_URL.
name: Daily rebuild (blog feed)

on:
  schedule:
    # GitHub cron runs in UTC. 04:00 UTC = 07:00 in summer (IDT, UTC+3),
    # 05:00 UTC = 07:00 in winter (IST, UTC+2). The job below keeps only the
    # one that matches the current Israel offset.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Asia/Jerusalem date +%z)
          if [ -n "$SCHEDULE" ]; then
            if [ "$offset" = "+0300" ] && [ "$SCHEDULE" != "0 4 * * *" ]; then
              echo "Summer time: the 04:00 UTC run handles today."; exit 0
            fi
            if [ "$offset" = "+0200" ] && [ "$SCHEDULE" != "0 5 * * *" ]; then
              echo "Winter time: the 05:00 UTC run handles today."; exit 0
            fi
          fi
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Repository secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
